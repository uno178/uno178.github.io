<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>写作后台</title>
<style>
*{box-sizing:border-box}
:root{--bg:#fff;--fg:#1a1a1a;--muted:#6b6b6b;--border:#e6e6e6;--accent:#c8442e;--card:#fafafa;--input:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#121212;--fg:#e8e8e8;--muted:#9a9a9a;--border:#2a2a2a;--accent:#e0674e;--card:#1a1a1a;--input:#1e1e1e}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.7 system-ui,-apple-system,"PingFang SC","Noto Sans SC",sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--border);z-index:5}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:54px;padding-top:0;padding-bottom:0}
h1{font-size:17px;margin:0;font-weight:700}
h2{font-size:15px;margin:0 0 12px;font-weight:650}
button{font:inherit;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--fg);padding:8px 14px;border-radius:9px}
button:active{transform:scale(.98)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.danger{color:#d33;border-color:#d33}
button:disabled{opacity:.5}
.card{border:1px solid var(--border);border-radius:12px;padding:16px;background:var(--card);margin-bottom:14px}
input,textarea{width:100%;font:inherit;color:var(--fg);background:var(--input);border:1px solid var(--border);border-radius:8px;padding:9px 11px;margin-bottom:10px}
textarea{resize:vertical;line-height:1.65}
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px;letter-spacing:.03em}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}
.list-item{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:13px 0;border-bottom:1px solid var(--border);cursor:pointer}
.list-item:last-child{border-bottom:0}
.list-item .t{font-weight:600;font-size:15px}
.list-item .d{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;
  padding:11px 18px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:90%;text-align:center}
.toast.show{opacity:1}
.toast.err{background:#c0392b}
.hint{font-size:13px;color:var(--muted);line-height:1.65}
.preview{border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;overflow:auto}
.preview h2{font-size:19px;margin:16px 0 10px}.preview h3{font-size:16px;margin:14px 0 8px}
.preview p{margin:0 0 12px}.preview blockquote{margin:0 0 12px;padding-left:14px;border-left:3px solid var(--accent);color:var(--muted)}
.preview code{background:var(--card);padding:2px 5px;border-radius:4px;font-size:.9em}
.preview pre{background:var(--card);padding:12px;border-radius:8px;overflow-x:auto}
.preview ul,.preview ol{padding-left:20px;margin:0 0 12px}
.preview hr{border:0;border-top:1px solid var(--border);margin:20px 0}
.hidden{display:none!important}
a{color:var(--accent)}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>写作后台</h1>
  <div class="row" style="flex:0 0 auto">
    <button id="btnLogout" class="hidden">退出</button>
  </div>
</div></header>

<div class="wrap">

  <!-- 登录 -->
  <section id="viewLogin" class="hidden">
    <div class="card">
      <h2>第一步：连接你的仓库</h2>
      <p class="hint">这个页面只有你能用。把 GitHub Token 粘进来，它只会保存在**你这台设备的浏览器**里，不会上传到任何地方。</p>
      <label>GitHub Token（需要 repo 权限）</label>
      <input id="inpToken" type="password" placeholder="ghp_..." autocomplete="off">
      <button class="primary" id="btnConnect">连接</button>
      <p class="hint" style="margin-top:14px">
        没有 Token？去 <a href="https://github.com/settings/tokens/new?scopes=repo&description=blog-admin" target="_blank">这里生成</a>（勾选 repo）<br>
        建议：有效期设长一点，比如 90 天或不过期。
      </p>
    </div>
  </section>

  <!-- 列表 -->
  <section id="viewList" class="hidden">
    <div class="row" style="margin-bottom:14px">
      <button class="primary" id="btnNew" style="flex:2">＋ 写新文章</button>
      <button id="btnRefresh">刷新</button>
    </div>
    <div class="card" id="postList"></div>
  </section>

  <!-- 编辑 -->
  <section id="viewEdit" class="hidden">
    <div class="row" style="margin-bottom:14px">
      <button id="btnBack" style="flex:1">← 返回</button>
      <button id="btnPreview" style="flex:1">预览</button>
      <button class="primary" id="btnSave" style="flex:2">保存并发布</button>
    </div>
    <div class="card">
      <label>标题</label><input id="fTitle" placeholder="文章标题">
      <div class="row">
        <div><label>日期</label><input id="fDate" type="date"></div>
        <div><label>标签（逗号分隔）</label><input id="fTags" placeholder="随笔, 思考"></div>
      </div>
      <label>摘要（列表页显示）</label><input id="fExcerpt" placeholder="一句话概括">
      <label>正文（Markdown）</label>
      <textarea id="fBody" rows="16" placeholder="支持 **加粗**、# 标题、- 列表、> 引用、```代码块```"></textarea>
      <div id="previewBox" class="preview hidden"></div>
      <div class="row" style="margin-top:6px">
        <button class="danger" id="btnDelete" style="flex:1">删除这篇文章</button>
      </div>
    </div>
  </section>

</div>
<div class="toast" id="toast"></div>

<script>
const OWNER='uno178', REPO='uno178.github.io', BRANCH='main', DIR='posts';
const API='https://api.github.com';
let token=localStorage.getItem('gh_token')||'';
let posts=[], current=null;   // current: {file, sha}

/* ---------- 工具 ---------- */
const $=id=>document.getElementById(id);
function toast(msg,err){const t=$('toast');t.textContent=msg;t.className='toast show'+(err?' err':'');clearTimeout(t._h);t._h=setTimeout(()=>t.className='toast',2600)}
function b64enc(s){const b=new TextEncoder().encode(s);let o='';for(const c of b)o+=String.fromCharCode(c);return btoa(o)}
function b64dec(s){const bin=atob(s.replace(/\s/g,''));return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)))}
async function api(path,opt={}){
  const r=await fetch(API+path,{...opt,headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opt.body?{'Content-Type':'application/json'}:{}),...(opt.headers||{})}});
  if(r.status===401) throw new Error('Token 无效或已过期');
  if(!r.ok){let m='';try{m=(await r.json()).message}catch{}throw new Error(m||('HTTP '+r.status))}
  return r.status===204?null:r.json();
}

/* ---------- 极简 Markdown（与构建脚本一致） ---------- */
function md(src){
  const blocks=[];
  src=src.replace(/```(\w*)\n([\s\S]*?)```/g,(_,l,c)=>{blocks.push(c.replace(/\n$/,''));return '\u0000C'+(blocks.length-1)+'\u0000'});
  const L=src.split('\n'),out=[];let i=0,inUl=false,inOl=false;
  const close=()=>{if(inUl){out.push('</ul>');inUl=false}if(inOl){out.push('</ol>');inOl=false}};
  const inl=t=>t.replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g,'<img src="$2" alt="$1" style="max-width:100%">')
    .replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g,'<a href="$2">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(?<!\*)\*([^*]+)\*(?!\*)/g,'<em>$1</em>')
    .replace(/`([^`]+)`/g,'<code>$1</code>');
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  while(i<L.length){
    let ln=L[i];
    if(/^\u0000C\d+\u0000$/.test(ln.trim())){close();out.push('<pre><code>'+esc(blocks[+ln.match(/\d+/)[0]])+'</code></pre>');i++;continue}
    if(!ln.trim()){close();i++;continue}
    if(/^---+$/.test(ln)){close();out.push('<hr>');i++;continue}
    const h=ln.match(/^(#{1,4})\s+(.*)$/);
    if(h){close();const lv=h[1].length+1;out.push('<h'+lv+'>'+inl(h[2])+'</h'+lv+'>');i++;continue}
    if(/^>\s?/.test(ln)){close();const b=[];while(i<L.length&&/^>\s?/.test(L[i])){b.push(L[i].replace(/^>\s?/,''));i++}out.push('<blockquote><p>'+inl(b.join(' '))+'</p></blockquote>');continue}
    if(/^\s*[-*]\s+/.test(ln)){if(!inUl){close();out.push('<ul>');inUl=true}out.push('<li>'+inl(ln.replace(/^\s*[-*]\s+/,''))+'</li>');i++;continue}
    if(/^\s*\d+\.\s+/.test(ln)){if(!inOl){close();out.push('<ol>');inOl=true}out.push('<li>'+inl(ln.replace(/^\s*\d+\.\s+/,''))+'</li>');i++;continue}
    close();const p=[];while(i<L.length&&L[i].trim()&&!/^(#{1,4}\s|>\s?|\s*[-*]\s|\s*\d+\.\s|---)/.test(L[i])&&!/^\u0000C/.test(L[i])){p.push(L[i]);i++}
    out.push('<p>'+inl(p.join(' '))+'</p>');
  }
  close();return out.join('\n');
}

/* ---------- 视图切换 ---------- */
function show(v){
  for(const id of['viewLogin','viewList','viewEdit'])$(id).classList.add('hidden');
  $(v).classList.remove('hidden');
  $('btnLogout').classList.toggle('hidden',!token);
}

/* ---------- 连接 ---------- */
async function connect(){
  const t=$('inpToken').value.trim();
  if(!t)return toast('先把 Token 粘进来',true);
  token=t;
  try{
    const me=await api('/user');
    localStorage.setItem('gh_token',t);
    toast('已连接：'+me.login);
    loadList();
  }catch(e){token='';toast(e.message,true)}
}

/* ---------- 列表 ---------- */
async function loadList(){
  try{
    const files=await api(`/repos/${OWNER}/${REPO}/contents/${DIR}?ref=${BRANCH}`);
    posts=files.filter(f=>f.name.endsWith('.md')).sort((a,b)=>b.name<a.name?-1:1);
    const box=$('postList');
    if(!posts.length){box.innerHTML='<p class="hint">还没有文章，点上面「写新文章」开始。</p>'}
    else{
      box.innerHTML=posts.map(p=>`<div class="list-item" data-f="${p.name}">
        <div><div class="t">${p.name.replace(/\.md$/,'')}</div><div class="d">${p.name}</div></div>
        <span style="color:var(--muted)">›</span></div>`).join('');
      box.querySelectorAll('.list-item').forEach(el=>el.onclick=()=>openPost(el.dataset.f));
    }
    show('viewList');
  }catch(e){toast(e.message,true)}
}

/* ---------- 打开/新建 ---------- */
async function openPost(name){
  try{
    if(name){
      const f=await api(`/repos/${OWNER}/${REPO}/contents/${DIR}/${name}?ref=${BRANCH}`);
      const raw=b64dec(f.content);
      current={file:name,sha:f.sha};
      const m=raw.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
      const fm={};if(m)m[1].split('\n').forEach(l=>{const x=l.match(/^(\w+)\s*:\s*(.*)$/);if(x)fm[x[1]]=x[2].trim()});
      $('fTitle').value=fm.title||''; $('fDate').value=fm.date||new Date().toISOString().slice(0,10);
      $('fTags').value=fm.tags||''; $('fExcerpt').value=fm.excerpt||'';
      $('fBody').value=m?m[2]:raw;
    }else{
      current={file:null,sha:null};
      $('fTitle').value=''; $('fDate').value=new Date().toISOString().slice(0,10);
      $('fTags').value=''; $('fExcerpt').value=''; $('fBody').value='';
    }
    $('previewBox').classList.add('hidden');
    $('btnDelete').style.display=current.file?'':'none';
    show('viewEdit');
    window.scrollTo(0,0);
  }catch(e){toast(e.message,true)}
}

/* ---------- 保存 ---------- */
async function save(){
  const title=$('fTitle').value.trim();
  const date=$('fDate').value.trim()||new Date().toISOString().slice(0,10);
  if(!title)return toast('标题不能为空',true);
  const body=$('fBody').value;
  let slug=current.file?current.file.replace(/\.md$/,''):title
    .toLowerCase().replace(/[^\w\u4e00-\u9fa5]+/g,'-').replace(/^-|-$/g,'').slice(0,50)||('post-'+Date.now());
  const file=slug+'.md';
  const fm=['---',`title: ${title}`,`date: ${date}`,
    `excerpt: ${$('fExcerpt').value.trim()||body.replace(/[#>*`\-]/g,'').replace(/\s+/g,' ').slice(0,90)+'…'}`,
    `tags: ${$('fTags').value.trim()}`,'---',''].join('\n');
  const content=fm+body;
  $('btnSave').disabled=true;
  try{
    await api(`/repos/${OWNER}/${REPO}/contents/${DIR}/${file}`,{
      method:'PUT',
      body:JSON.stringify({message:`post: ${title}`,content:b64enc(content),branch:BRANCH,...(current.sha?{sha:current.sha}:{})})
    });
    toast('已发布，约 1 分钟上线');
    await loadList();
  }catch(e){toast(e.message,true)}
  finally{$('btnSave').disabled=false}
}

/* ---------- 删除 ---------- */
async function del(){
  if(!current.file)return;
  if(!confirm('确定删除《'+(current.file.replace(/\.md$/,''))+'》？'))return;
  try{
    await api(`/repos/${OWNER}/${REPO}/contents/${DIR}/${current.file}`,{
      method:'DELETE',body:JSON.stringify({message:'delete '+current.file,sha:current.sha,branch:BRANCH})});
    toast('已删除');
    await loadList();
  }catch(e){toast(e.message,true)}
}

/* ---------- 事件 ---------- */
$('btnConnect').onclick=connect;
$('inpToken').onkeydown=e=>{if(e.key==='Enter')connect()};
$('btnNew').onclick=()=>openPost(null);
$('btnRefresh').onclick=loadList;
$('btnBack').onclick=loadList;
$('btnSave').onclick=save;
$('btnDelete').onclick=del;
$('btnPreview').onclick=()=>{
  const p=$('previewBox');
  if(!p.classList.contains('hidden')){p.classList.add('hidden');$('btnPreview').textContent='预览';return}
  p.innerHTML=md($('fBody').value||'（空）');p.classList.remove('hidden');$('btnPreview').textContent='收起预览';
};
$('btnLogout').onclick=()=>{localStorage.removeItem('gh_token');token='';show('viewLogin')};

/* ---------- 启动 ---------- */
if(token){api('/user').then(loadList).catch(()=>{token='';show('viewLogin')})}
else show('viewLogin');
</script>
</body>
</html>
