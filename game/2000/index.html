<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>2000年冬</title>
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<div id="stage">

  <!-- 背景框（居中、白描边） -->
  <div id="frame">
    <div id="bgA" class="bg"></div>
    <div id="bgB" class="bg"></div>
  </div>

  <!-- 雪（在人物之后） -->
  <div id="snow"></div>

  <!-- 立绘（右侧、半身） -->
  <div id="charBox"><img id="char" alt=""></div>

  <!-- 游戏 UI -->
  <div id="gameUI">
    <div id="topbar">
      <div class="title" id="topTitle">2000年冬</div>
      <div class="btns">
        <a class="btn" id="blogBack" href="/game/" style="text-decoration:none">← 博客</a>
        <button class="btn" id="btnPanel">菜单</button>
      </div>
    </div>
    <div id="textbox">
      <div id="speaker"></div>
      <div id="text"></div>
      <div id="next"></div>
    </div>
  </div>

  <!-- 标题页 -->
  <div id="titleScreen">
    <h1>2000年冬</h1>
    <div class="sub">A WINTER IN 2000</div>
    <button id="startBtn">开 始</button>
    <div class="hint">横屏游玩 · 建议戴耳机</div>
    <a id="titleBack" href="/game/">← 返回博客</a>
  </div>

  <!-- 菜单（无存档） -->
  <div id="panel">
    <div class="card">
      <h2>菜单</h2>
      <div class="vol">
        <span style="font-size:12px;color:#9a9a9a;letter-spacing:.2em">音量</span>
        <input type="range" id="vol" min="0" max="100" value="70">
        <span id="volTxt" style="font-size:12px;color:#9a9a9a;width:30px;text-align:right">70</span>
      </div>
      <div class="row" style="margin-top:22px;justify-content:flex-end">
        <button class="btn" id="btnClose">继续</button>
        <button class="btn" id="btnTitle">回到标题</button>
      </div>
    </div>
  </div>

  <div id="credits"></div>

  <!-- 强制横屏 -->
  <div id="rotate">
    <div class="ico"></div>
    <p>请将手机横过来</p>
    <small>本游戏仅支持横屏</small>
  </div>

</div>
<script src="src/engine.js"></script>
</body>
</html>
